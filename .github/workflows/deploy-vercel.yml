name: Deploy to Vercel

# Deploys via the Vercel CLI using a token, so no GitHub<->Vercel account
# link is required. Create a token in the target Vercel account
# (vercel.com -> Settings -> Tokens) and add it as the VERCEL_TOKEN
# repository secret. Optionally set VERCEL_ORG_ID and VERCEL_PROJECT_ID
# secrets to deploy into an existing Vercel project; without them the
# first deploy creates a new project in the token's default scope.
#
# main            -> production
# any other branch -> preview, so a change can be looked at before it ships
# manual run       -> whichever target you pick
#
# The deployment URL is printed to the log and written to the run summary.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        type: choice
        options:
          - production
          - preview
        default: production
  push:
    branches: ["**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        run: |
          # Strip git metadata so Vercel treats this as a plain token deploy.
          # With it present, Vercel blocks the deployment when the commit
          # author's GitHub identity isn't linked to the Vercel account.
          rm -rf .git
          npm install -g vercel@latest
          if [ -n "${{ secrets.VERCEL_ORG_ID }}" ]; then
            export VERCEL_ORG_ID="${{ secrets.VERCEL_ORG_ID }}"
          fi
          if [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            export VERCEL_PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID }}"
          else
            # Without a project ID the CLI derives the project name from the
            # checkout directory, which is rejected for containing uppercase
            # letters. Link (creating on first run) an explicit lowercase name.
            vercel link --yes --project gr8fulproject-site --token "${{ secrets.VERCEL_TOKEN }}"
          fi

          # A manual run picks its own target. Otherwise main ships and every
          # other branch gets a preview.
          if [ -n "${{ inputs.target }}" ]; then
            TARGET="${{ inputs.target }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="production"
          else
            TARGET="preview"
          fi

          if [ "$TARGET" = "production" ]; then
            URL=$(vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" | tail -1)
          else
            URL=$(vercel deploy --yes --token "${{ secrets.VERCEL_TOKEN }}" | tail -1)
          fi

          # Marker line so an agent can lift the URL straight out of the log.
          echo "DEPLOY_URL=$URL"
          echo "### $TARGET deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
